<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Merger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 121, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(52, 211, 153, 0.2) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 40px 32px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6); }
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
        }

        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(102, 126, 234, 0.05);
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.2);
        }

        .upload-area.dragover {
            border-color: #ff79c6;
            background: rgba(255, 121, 198, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(255, 121, 198, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 16px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            display: none;
            backdrop-filter: blur(10px);
        }

        .file-info.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-name {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .file-size {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .status {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .status.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .status.processing {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }

        .status.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34d399;
        }

        .status.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #f87171;
        }

        .download-btn {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .download-btn.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .convert-more-btn {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .convert-more-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .convert-more-btn.show {
            display: block;
            animation: slideIn 0.4s ease-out 0.1s backwards;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #ff79c6 100%);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.3s ease;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .csv-count {
            margin-top: 10px;
            color: #34d399;
            font-weight: 600;
            font-size: 14px;
        }

        .row-count {
            margin-top: 5px;
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            animation: sparkleFloat 3s ease-out forwards;
        }

        @keyframes sparkleFloat {
            0% { 
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔗</div>
            <h1>CSV Unifier</h1>
            <p class="subtitle">Merge all CSV files into one unified Excel spreadsheet</p>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📊</div>
            <div class="upload-text">Drop your ZIP file here</div>
            <div class="upload-hint">or click to browse • ZIP with CSV files • Max 50MB</div>
            <input type="file" id="fileInput" accept=".zip">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
            <div class="csv-count" id="csvCount"></div>
            <div class="row-count" id="rowCount"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status"></div>

        <button class="download-btn" id="downloadBtn">⬇️ Download Merged Excel</button>
        <button class="convert-more-btn" id="convertMoreBtn">🔄 Merge Another File</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const csvCount = document.getElementById('csvCount');
        const rowCount = document.getElementById('rowCount');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const convertMoreBtn = document.getElementById('convertMoreBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let workbook = null;

        // Sparkle effect
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 3000);
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                createSparkle(e.clientX, e.clientY);
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.name.endsWith('.zip')) {
                showStatus('⚠️ Please upload a ZIP file', 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showStatus('⚠️ File size exceeds 50MB limit', 'error');
                return;
            }

            fileName.textContent = '📦 ' + file.name;
            fileSize.textContent = `Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            fileInfo.classList.add('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');

            showStatus('⚡ Processing ZIP file...', 'processing');
            progressBar.classList.add('show');
            updateProgress(10);

            try {
                const zip = await JSZip.loadAsync(file);
                const csvFiles = Object.keys(zip.files).filter(name => 
                    name.endsWith('.csv') && !name.startsWith('__MACOSX')
                );

                if (csvFiles.length === 0) {
                    showStatus('❌ No CSV files found in ZIP', 'error');
                    progressBar.classList.remove('show');
                    return;
                }

                csvCount.textContent = `✓ Found ${csvFiles.length} CSV file${csvFiles.length > 1 ? 's' : ''}`;
                updateProgress(30);

                // Array to store all rows from all CSV files
                let allRows = [];
                let processed = 0;
                let totalRowsProcessed = 0;

                for (const csvFile of csvFiles) {
                    const content = await zip.files[csvFile].async('string');
                    const parsed = Papa.parse(content, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true
                    });

                    if (parsed.data.length > 0) {
                        allRows = allRows.concat(parsed.data);
                        totalRowsProcessed += parsed.data.length;
                    }

                    processed++;
                    updateProgress(30 + (processed / csvFiles.length) * 60);
                }

                if (allRows.length === 0) {
                    showStatus('❌ No data found in CSV files', 'error');
                    progressBar.classList.remove('show');
                    return;
                }

                rowCount.textContent = `📝 Total rows: ${totalRowsProcessed.toLocaleString()}`;

                // Create a new workbook with single sheet containing all data
                workbook = XLSX.utils.book_new();
                const mergedSheet = XLSX.utils.json_to_sheet(allRows);
                XLSX.utils.book_append_sheet(workbook, mergedSheet, 'Merged Data');

                updateProgress(100);
                showStatus(`🎉 Successfully merged ${csvFiles.length} CSV file${csvFiles.length > 1 ? 's' : ''} with ${totalRowsProcessed.toLocaleString()} rows!`, 'success');
                downloadBtn.classList.add('show');
                convertMoreBtn.classList.add('show');

            } catch (error) {
                showStatus('❌ Error processing ZIP file: ' + error.message, 'error');
                progressBar.classList.remove('show');
                console.error(error);
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (workbook) {
                XLSX.writeFile(workbook, 'merged_csvs.xlsx');
                showStatus('✅ Excel file downloaded successfully!', 'success');
                
                // Create sparkles on download
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createSparkle(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight
                        );
                    }, i * 100);
                }
            }
        });

        convertMoreBtn.addEventListener('click', () => {
            // Reset everything
            fileInput.value = '';
            fileInfo.classList.remove('show');
            status.classList.remove('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
            workbook = null;
            fileName.textContent = '';
            fileSize.textContent = '';
            csvCount.textContent = '';
            rowCount.textContent = '';
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
        }
    </script>
</body>
</html>
